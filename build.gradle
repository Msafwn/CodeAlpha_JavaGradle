plugins {
    id 'java'
    id 'application'
}

group = 'com.codealpha'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.codealpha.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
